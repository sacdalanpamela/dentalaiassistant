# version: '3.9'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - ollama
    environment:
      OLLAMA_BASE_URL: http://ollama:11434

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
  
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
volumes:
  ollama_data: